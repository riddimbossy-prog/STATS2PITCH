<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <title>Stats2Pitch</title>
  <link rel="manifest" href="/manifest.webmanifest?v=5.3.2">
  <link rel="icon" type="image/png" href="/assets/stats2pitch-favicon-v2.png">
  <link rel="apple-touch-icon" href="/assets/stats2pitch-favicon-v2.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/conceptD.css?v=5.3.2">
  <link rel="stylesheet" href="/mobile2026.css?v=5.3.2">
  <link rel="stylesheet" href="/fontPlus2.css?v=5.3.2">
</head>
<body data-view="all">
  <div class="app">
    <header>
      <div class="header-inner">
        <div class="brand">
          <div class="brand-mark">S2</div>
          <div class="brand-copy">
            <div class="brand-text">STATS<span>2</span>PITCH <em class="year-badge">2026</em></div>
            <div class="brand-sub">Smart Football Picks</div>
          </div>
        </div>
        <nav class="page-tabs">
          <a class="page-tab active" href="/">All Picks</a>
          <a class="page-tab" href="/filter-tips.html">Filter Tips</a>
          <a class="page-tab" href="/var-tips.html">VAR Tips</a>
          <a class="page-tab" href="/results.html">Results</a>
        </nav>
        <div class="header-actions">
          <button id="installApp" hidden>Install</button>
          <button class="icon-btn" id="notifyBell" aria-label="Refresh" title="Refresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 10-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5"/><path d="M9 17a3 3 0 006 0"/></svg>
          </button>
          <button class="icon-btn" id="profileBtn" aria-label="Filters" title="Filters">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 19c1.1-3.1 3.4-4.6 7-4.6s5.9 1.5 7 4.6"/></svg>
          </button>
          <button id="refresh">Refresh</button>
        </div>
      </div>
    </header>
    <div class="wrap">
      <section id="todayStats"></section>
      <div class="controls-shell">
        <nav id="dates"></nav>
        <div class="toolbar filters">
          <select id="statusFilter" aria-label="Match status">
            <option value="all">All statuses</option>
            <option value="upcoming">Upcoming</option>
            <option value="live">Live</option>
            <option value="settled">Settled</option>
          </select>
          <select id="seasonFilter" aria-label="Season stage">
            <option value="all">All season stages</option>
            <option value="early">🚩 Early season</option>
            <option value="solid">Solid season</option>
          </select>
          <select id="countryFilter" aria-label="Country">
            <option value="all">All countries</option>
          </select>
          <select id="leagueFilter" aria-label="League">
            <option value="all">All leagues</option>
          </select>
          <select id="market" aria-label="Market">
            <option value="all">All markets</option>
          </select>
          <button id="clearFilters">Clear</button>
          <span id="status"></span>
        </div>
      </div>
      <div id="countryChips" class="country-chips" aria-label="Country shortcuts"></div>
      <main id="cards"></main>
    </div>
  </div>
  <div id="modal" class="modal hidden"></div>
  <nav class="mobile-nav">
    <a class="active" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      <span>Picks</span>
    </a>
    <a href="/filter-tips.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      <span>Filter</span>
    </a>
    <a href="/var-tips.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>
      <span>VAR</span>
    </a>
    <a href="/results.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
      <span>Results</span>
    </a>
  </nav>
  <script src="/runtime-config.js"></script>
  <script src="/leagueFlags.js?v=5.3.2"></script>
  <script type="module" src="/appCrests.js?v=5.3.2"></script>
  <script src="/pwa.js?v=5.3.2"></script>
</body>
</html>
