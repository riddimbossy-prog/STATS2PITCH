<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bankers · Stats2Pitch</title>
<link rel="icon" type="image/png" sizes="512x512" href="/assets/stats2pitch-favicon.png">
<link rel="apple-touch-icon" href="/assets/stats2pitch-favicon.png">
<link rel="stylesheet" href="/styles.css?v=20260814-tabs4">
<link rel="stylesheet" href="/teamCrests.css?v=20260814-tabs4">
<link rel="stylesheet" href="/mintTheme.css?v=20260814-tabs4">
<link rel="stylesheet" href="/popupLayerFix.css?v=20260814-tabs4">
<link rel="stylesheet" href="/noPink.css?v=20260814-tabs4">

<body data-view="bankers">
<div class="app">
<header>
  <div class="brand-block"><img class="brand-img" src="/assets/stats2pitch-logo.png" alt="Stats2Pitch logo"><small>Smart Football Picks</small></div>
  <button id="refresh">Refresh</button>
</header>
<div class="page-tabs"><a class="page-tab" href="/">All Picks</a><a class="page-tab active" href="/bankers.html">Bankers</a></div>
<section class="page-intro"><strong>100% Agreement Bankers</strong><span>Only picks where both teams' recent venue results agree completely.</span></section>
<nav id="dates"></nav>
<div class="toolbar filters">
  <select id="kickoffFilter" aria-label="Kickoff status"><option value="upcoming">Upcoming</option><option value="all">All kickoffs</option></select>
  <select id="countryFilter" aria-label="Country"><option value="all">All countries</option></select>
  <select id="leagueFilter" aria-label="League"><option value="all">All leagues</option></select>
  <select id="market" aria-label="Market"><option value="all">All markets</option></select>
  <button id="clearFilters" class="clear-filters">Clear</button>
  <span id="status"></span>
</div>
<main id="cards"></main>
</div>
<div id="modal" class="modal hidden"></div>
<script src="/runtime-config.js"></script>
<script src="/leagueFlags.js?v=20260814-tabs4"></script>
<script type="module" src="/appCrests.js?v=20260814-tabs4"></script>
</body>
</html>
