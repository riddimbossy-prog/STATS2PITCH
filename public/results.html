<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <title>Results · Stats2Pitch</title>
  <link rel="manifest" href="/manifest.webmanifest?v=5.1.0">
  <link rel="icon" type="image/png" href="/assets/stats2pitch-favicon-v2.png">
  <link rel="apple-touch-icon" href="/assets/stats2pitch-favicon-v2.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/conceptD.css?v=5.1.0">
  <link rel="stylesheet" href="/mobile2026.css?v=5.1.0">
</head>
<body data-view="results">
  <div class="app">
    <header>
      <div class="header-inner">
        <div class="brand">
          <div class="brand-mark">S2</div>
          <div class="brand-copy">
            <div class="brand-text">STATS<span>2</span>PITCH <em class="year-badge">2026</em></div>
            <div class="brand-sub">Results & Performance</div>
          </div>
        </div>
        <nav class="page-tabs">
          <a class="page-tab" href="/">All Picks</a>
          <a class="page-tab" href="/bankers.html">Bankers</a>
          <a class="page-tab active" href="/results.html">Results</a>
        </nav>
        <div class="header-actions">
          <button id="installApp" hidden>Install</button>
          <button class="icon-btn" id="notifyBell" aria-label="Refresh" title="Refresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 10-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5"/><path d="M9 17a3 3 0 006 0"/></svg>
          </button>
          <button class="icon-btn" id="profileBtn" aria-label="Filters" title="Filters">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 19c1.1-3.1 3.4-4.6 7-4.6s5.9 1.5 7 4.6"/></svg>
          </button>
          <button id="refresh">Refresh</button>
        </div>
      </div>
    </header>
    <div class="wrap">
      <div class="section-title">
        <div>
          <h2>30-Day Performance</h2>
          <p>Settled picks only. Voids are excluded from success rate.</p>
        </div>
        <span class="results-range">Last 30 days</span>
      </div>
      <section id="performanceSummary" class="performance-summary"></section>
      <div class="performance-controls">
        <strong>Breakdown</strong>
        <select id="performanceGroup">
          <option value="market">By market</option>
          <option value="country">By country</option>
          <option value="league">By league</option>
          <option value="confidence">By confidence</option>
        </select>
      </div>
      <section id="performanceTable" class="performance-table"></section>
      <div class="section-title">
        <div>
          <h2>Daily Proof Board</h2>
          <p>Original published tips and settled outcomes.</p>
        </div>
      </div>
      <div class="controls-shell">
        <nav id="dates"></nav>
        <div class="toolbar filters">
          <select id="statusFilter">
            <option value="settled">Settled</option>
            <option value="live">Live</option>
            <option value="upcoming">Upcoming</option>
            <option value="all">All statuses</option>
          </select>
          <select id="seasonFilter" aria-label="Season stage">
            <option value="all">All season stages</option>
            <option value="early">🚩 Early season</option>
            <option value="solid">Solid season</option>
          </select>
          <select id="countryFilter"><option value="all">All countries</option></select>
          <select id="leagueFilter"><option value="all">All leagues</option></select>
          <select id="market"><option value="all">All markets</option></select>
          <button id="clearFilters">Clear</button>
          <span id="status"></span>
        </div>
      </div>
      <div id="countryChips" class="country-chips"></div>
      <main id="cards"></main>
    </div>
  </div>
  <div id="modal" class="modal hidden"></div>
    <nav class="mobile-nav">
    <a href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      <span>Picks</span>
    </a>
    <a href="/bankers.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v6c0 5-3.4 8.2-8 10-4.6-1.8-8-5-8-10V7l8-4z"/></svg>
      <span>Bankers</span>
    </a>
    <a class="active" href="/results.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
      <span>Results</span>
    </a>
  </nav>
  <script src="/runtime-config.js"></script>
  <script src="/leagueFlags.js?v=5.1.0"></script>
  <script type="module" src="/appCrests.js?v=5.1.0"></script>
  <script src="/pwa.js?v=5.1.0"></script>
</body>
</html>
