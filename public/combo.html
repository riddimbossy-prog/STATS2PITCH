<body data-view="combo">
  <div id="boot" class="s2p-boot" role="status" aria-live="polite" aria-label="Loading Stats2Pitch">
    <video class="s2p-boot-video" autoplay muted loop playsinline preload="metadata" poster="/assets/s2p-boot.jpg?v=5.7.0"><source src="/assets/s2p-boot.mp4?v=5.7.0" type="video/mp4"></video>
  </div>
  <script>
    (function(){var b=document.getElementById('boot'),v=b&&b.querySelector('video'),shown=Date.now(),done=false;if(v){var p=v.play();if(p&&p.catch)p.catch(function(){})}window.s2pBootDone=function(){if(done)return;done=true;setTimeout(function(){if(b)b.classList.add('is-done');document.documentElement.classList.remove('s2p-booting');setTimeout(function(){try{if(v){v.pause();v.removeAttribute('src');v.load()}if(b)b.remove()}catch(e){}},520)},Math.max(0,80-(Date.now()-shown)))};setTimeout(function(){window.s2pBootDone()},4000)})();
  </script>

  <div class="app">
    <header>

        </div>
        <nav class="page-tabs">
          <a class="page-tab" href="/">All Picks</a>
          <a class="page-tab" href="/filter-tips.html">Filter Tips</a>
          <a class="page-tab" href="/var-tips.html">VAR Tips</a>
          <a class="page-tab" href="/goals-bankers.html">Goals Bankers</a>
          <a class="page-tab active" href="/combo.html">Combo</a>
          <a class="page-tab" href="/daily-bankers.html">Daily Bankers</a>
          <a class="page-tab" href="/results.html">Results</a>
        </nav>
        <div class="header-actions">
          <button id="installApp" hidden>Install</button>
          <button class="icon-btn" id="notifyBell" aria-label="Refresh" title="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 10-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
          <button class="icon-btn" id="profileBtn" aria-label="Filters" title="Filters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg></button>
          <button id="refresh">Refresh</button>
        </div>
      </div>
    </header>

    <div class="wrap">
      <section id="todayStats"></section>
      <div class="controls-shell combo-controls">
        <nav id="dates"></nav>
        <div class="toolbar filters">
          <select id="statusFilter" aria-label="Match status"><option value="all">All statuses</option><option value="upcoming">Upcoming</option><option value="live">Live</option><option value="settled">Settled</option></select>
          <select id="countryFilter" aria-label="Country"><option value="all">All countries</option></select>
          <select id="leagueFilter" aria-label="League"><option value="all">All leagues</option></select>
          <select id="familyFilter" aria-label="Combo type"><option value="all">All combo types</option><option value="result-goals">Result + O/U 2.5</option><option value="result-gg">Result + GG</option><option value="result-clean-sheet">Result + Clean Sheet</option></select>
          <button id="clearFilters">Clear</button>
          <span id="status">Loading…</span>
        </div>
      </div>
      <div id="countryChips" class="country-chips" aria-label="Country shortcuts"></div>
      <main id="cards"><div class="empty">Loading Combo picks…</div></main>
    </div>
  </div>

  <div id="modal" class="modal hidden"></div>
