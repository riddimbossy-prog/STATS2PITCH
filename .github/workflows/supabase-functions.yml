name: Deploy Supabase Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'scripts/authSmoke.mjs'
      - '.github/workflows/supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STATS2PITCH_ELITE_FEED_TOKEN: ${{ secrets.STATS2PITCH_ELITE_FEED_TOKEN }}
      APP_TIMEZONE: ${{ vars.APP_TIMEZONE || 'Africa/Accra' }}
      AUTO_REFRESH_TTL_MINUTES: ${{ vars.AUTO_REFRESH_TTL_MINUTES || '45' }}
      ALLOW_PUBLIC_SIGNUP: ${{ vars.ALLOW_PUBLIC_SIGNUP || 'true' }}
      STATS2PITCH_ALLOWED_ORIGIN: https://www.stats2pitch.com
      STATS2PITCH_ADMIN_EMAILS: ${{ secrets.STATS2PITCH_ADMIN_EMAILS }}
      STATS2PITCH_GITHUB_TOKEN: ${{ secrets.STATS2PITCH_GITHUB_TOKEN }}
      SPORTYBET_COUNTRY: ${{ vars.SPORTYBET_COUNTRY || 'gh' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Validate Supabase deployment secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing GitHub secret SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing GitHub secret SUPABASE_PROJECT_REF" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing GitHub secret SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "Missing GitHub secret SUPABASE_ANON_KEY" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing GitHub secret SUPABASE_SERVICE_ROLE_KEY" && exit 1)
      - name: Sync Edge Function secrets
        run: |
          npx --yes supabase@latest secrets set \
            APP_TIMEZONE="$APP_TIMEZONE" \
            SPORTYBET_COUNTRY="${SPORTYBET_COUNTRY:-gh}" \
            AUTO_REFRESH_TTL_MINUTES="$AUTO_REFRESH_TTL_MINUTES" \
            ALLOW_PUBLIC_SIGNUP="$ALLOW_PUBLIC_SIGNUP" \
            STATS2PITCH_ALLOWED_ORIGIN="$STATS2PITCH_ALLOWED_ORIGIN" \
            --project-ref "$SUPABASE_PROJECT_REF"
          if [ -n "$STATS2PITCH_ELITE_FEED_TOKEN" ]; then
            npx --yes supabase@latest secrets set STATS2PITCH_ELITE_FEED_TOKEN="$STATS2PITCH_ELITE_FEED_TOKEN" --project-ref "$SUPABASE_PROJECT_REF"
          fi
          if [ -n "$STATS2PITCH_ADMIN_EMAILS" ]; then
            npx --yes supabase@latest secrets set STATS2PITCH_ADMIN_EMAILS="$STATS2PITCH_ADMIN_EMAILS" --project-ref "$SUPABASE_PROJECT_REF"
          fi
          if [ -n "$STATS2PITCH_GITHUB_TOKEN" ]; then
            npx --yes supabase@latest secrets set STATS2PITCH_GITHUB_TOKEN="$STATS2PITCH_GITHUB_TOKEN" --project-ref "$SUPABASE_PROJECT_REF"
          fi
      - name: Deploy Stats2Pitch API
        run: npx --yes supabase@latest functions deploy stats2pitch-api --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Deploy Stats2Pitch Auth
        run: npx --yes supabase@latest functions deploy stats2pitch-auth --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Verify login, API identity and token refresh
        run: node scripts/authSmoke.mjs
