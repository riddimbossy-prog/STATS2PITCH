name: Publish split bankers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/split-bankers.json'
      - 'scripts/publishSplitBankers.mjs'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write split bankers into the Predict2U snapshot
        run: node scripts/publishSplitBankers.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
