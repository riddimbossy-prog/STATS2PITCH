name: Refresh Boards

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'scripts/**'
      - '.github/workflows/refresh-board.yml'
  schedule:
    - cron: "17 */3 * * *"

concurrency:
  group: stats2pitch-board-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate refresh secrets
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$API_FOOTBALL_KEY" || (echo "Missing API_FOOTBALL_KEY" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)
      - name: Generate fresh Stats2Pitch boards
        run: npm run refresh
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_BASE: ${{ secrets.API_FOOTBALL_BASE }}
          STATS_API_KEY: ${{ secrets.STATS_API_KEY }}
          STATS_API_BASE_URL: ${{ secrets.STATS_API_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENGINE_MIN_ODD: "1.20"
          ENGINE_MAX_ODD: "1.55"
          ENGINE_MIN_CONSENSUS: "80"
          ODDS_VERIFY_MAX_RELATIVE_DIFF: "0.15"
          ODDS_REQUIRE_CROSS_SOURCE: "false"
          BOARD_DAYS_FORWARD: "6"
          REFRESH_CONCURRENCY: "3"

      - name: Settle published picks
        run: npm run settle
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_BASE: ${{ secrets.API_FOOTBALL_BASE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESULT_LOOKBACK_DAYS: "45"
