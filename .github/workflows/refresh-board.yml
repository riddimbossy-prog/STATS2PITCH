name: Refresh Boards
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run refresh
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_BASE: ${{ secrets.API_FOOTBALL_BASE }}
          STATS_API_KEY: ${{ secrets.STATS_API_KEY }}
          STATS_API_BASE_URL: ${{ secrets.STATS_API_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENGINE_MIN_ODD: "1.20"
          ENGINE_MAX_ODD: "1.55"
          ENGINE_MIN_CONSENSUS: "80"
          ODDS_VERIFY_MAX_RELATIVE_DIFF: "0.15"
          ODDS_REQUIRE_CROSS_SOURCE: "false"
          BOARD_DAYS_FORWARD: "6"
