name: Transition Candidate Scope Patch

on:
  push:
    branches:
      - hard-rule/transition-safety-gate

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hard-rule/transition-safety-gate
      - name: Scope leak redirect to viable side candidates
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('server/bankerEngine.js')
          s=p.read_text()
          s=s.replace("  let leakRedirect=Boolean(winTransition?.redirectGoals||notLoseTransition?.redirectGoals)\n", "  let leakRedirect=false\n", 1)
          needle="  const straightAwayAllPass=straightAwayChecks.every(x=>x.ok)\n\n"
          insert="  const straightAwayAllPass=straightAwayChecks.every(x=>x.ok)\n  if(!ignoreTransition&&straightHomeFactorCount>=BANKER_RULES.straightHomeMinFactors&&straightAwayAllPass&&winTransition?.redirectGoals)leakRedirect=true\n\n"
          if needle not in s: raise SystemExit('straight candidate insertion point missing')
          s=s.replace(needle,insert,1)
          needle="  const notWinHomePass=Number(home.ppg)>=BANKER_RULES.notWinHomeMinPPG\n\n"
          insert="  const notWinHomePass=Number(home.ppg)>=BANKER_RULES.notWinHomeMinPPG\n  if(!ignoreTransition&&notWinHomePass&&notWinAwayFactorCount>=BANKER_RULES.notWinAwayMinFactors&&notLoseTransition?.redirectGoals)leakRedirect=true\n\n"
          if needle not in s: raise SystemExit('not-lose candidate insertion point missing')
          s=s.replace(needle,insert,1)
          p.write_text(s)
          PY
          node --check server/bankerEngine.js
          npm test
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/bankerEngine.js
          git commit -m "Scope leak redirect to viable team-side candidates"
          git push origin HEAD:hard-rule/transition-safety-gate
