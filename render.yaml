services:
  - type: web
    name: stats2pitch
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: PORT
        value: 3000
      - key: APP_TIMEZONE
        value: UTC
      - key: ALLOW_PUBLIC_SIGNUP
        value: true
      - key: AUTO_REFRESH_TTL_MINUTES
        value: 45
      - key: MAX_FIXTURES_PER_REFRESH
        value: 80
      - key: REFRESH_CONCURRENCY
        value: 4
      - key: API_FOOTBALL_BASE
        value: https://v3.football.api-sports.io
      - key: API_FOOTBALL_KEY
        sync: false
      - key: STATS_API_KEY
        sync: false
      - key: STATS_API_BASE_URL
        value: https://api.thestatsapi.com/api
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
